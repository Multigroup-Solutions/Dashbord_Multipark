name: IA — comunicação com clientes
# Triagem do WhatsApp (debounce vencido), reclamações por triar, rascunhos das
# críticas novas e correspondências dos Perdidos. Lotes pequenos (custo) e
# prazo < 60 s no servidor. Nada é enviado a clientes: tudo fica por aprovar.
# Interruptores em Definições → Automações (AI_COMPLAINT_TRIAGE,
# AI_REVIEW_AUTO_DRAFTS, AI_WHATSAPP_TRIAGE, AI_LOST_FOUND_MATCH).
on:
  # Sem schedule: quem agenda é o /api/cron/tick (cron-job.org) — ver
  # docs/ajuda/agendador.md. Aqui fica só a corrida manual.
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write # alerta: abrir/comentar issue em caso de falha
concurrency:
  group: ai-comms
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/ai-comms
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://dashbord-multipark.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status=$(curl --silent --show-error --max-time 58 --output /tmp/ai.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/ai-comms")
          head -c 1000 /tmp/ai.json; echo
          test "$status" = 200
          jq -e '.ok == true' /tmp/ai.json >/dev/null
      - name: Alerta — abrir/comentar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 Cron multipark falhou: ai-comms"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Run falhado: $run_url — $(date -u +'%Y-%m-%d %H:%M UTC')"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
