name: BD Multipark — descobrir esquema (manual)
# Corre a descoberta do esquema da BD da aplicação Multipark DENTRO da Vercel
# (é lá que está a DATABASE_URL_MULTIPARK, guardada como "sensível") e guarda
# o resultado como artefacto `multipark-db-schema` (schema.md).
# SÓ ESTRUTURA: tabelas, colunas, chaves, índices, enums e contagens
# aproximadas — nunca linhas de reservas, clientes ou condutores.
# Ver docs/multipark-db/README.md.
on:
  workflow_dispatch:
    inputs:
      schema:
        description: "Esquemas a ler, separados por vírgula (vazio = todos os do utilizador)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/cron/multipark-db-schema
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://dashbord-multipark.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          mkdir -p out
          q=""
          if [ -n "$SCHEMA" ]; then q="?schema=$(printf '%s' "$SCHEMA" | jq -sRr @uri)"; fi
          code=$(curl -sS -m 90 -w '%{http_code}' -o out/schema.md \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/multipark-db-schema$q") \
            || { echo "::error::curl falhou ao contactar o endpoint"; cat out/schema.md || true; exit 1; }
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat out/schema.md; echo
            echo "::error::endpoint devolveu HTTP $code"; exit 1
          fi
          head -n 40 out/schema.md
      - uses: actions/upload-artifact@v4
        with:
          name: multipark-db-schema
          path: out/schema.md
          retention-days: 14
