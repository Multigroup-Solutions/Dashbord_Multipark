name: Recuperar notificações Multipark
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multipark-delivery-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Processar notificações pendentes
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://dashboard.multipark.pt' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 65 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/multipark-deliveries" > result.json
          node -e 'const r = require("./result.json"); console.log(r); if (r.ok !== true) process.exit(1)'
