name: Recuperar notificações Multipark
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write # alerta: abrir/comentar issue em caso de falha
concurrency:
  group: multipark-delivery-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Processar notificações pendentes
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://dashbord-multipark.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 65 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/multipark-deliveries" > result.json
          # Erros de itens individuais (reserva ainda incompleta, histórico que
          # falhou) já são repetidos pela fila com backoff: ficam como aviso.
          # Vermelho só quando o endpoint em si falha (HTTP != 2xx → curl acima).
          node -e 'const r = require("./result.json"); console.log(r); if (r.ok !== true) console.log(`::warning::itens por repetir — fila: ${r.failed ?? 0}, detalhe: ${r.details?.errors ?? 0}, histórico: ${r.history?.errors ?? 0}`)'
      - name: Alerta — abrir/comentar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 Cron multipark falhou: multipark-deliveries"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Run falhado: $run_url — $(date -u +'%Y-%m-%d %H:%M UTC')"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
