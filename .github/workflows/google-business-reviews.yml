name: Google Business Profile reviews
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write # alerta: abrir/comentar issue em caso de falha
concurrency:
  group: google-business-reviews
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Recolher avaliações, desempenho dos perfis e retomar o pendente
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://dashbord-multipark.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --max-time 55 --output /tmp/reviews.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/google-business")
            test "$status" = 200
            jq -e '.ok == true' /tmp/reviews.json >/dev/null
            if jq -e '.done == true or .skipped == "busy"' /tmp/reviews.json >/dev/null; then break; fi
          done
      - name: Alerta — abrir/comentar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 Cron multipark falhou: google-business-reviews"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Run falhado: $run_url — $(date -u +'%Y-%m-%d %H:%M UTC')"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
